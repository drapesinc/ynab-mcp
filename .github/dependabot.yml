# Dependabot: few PRs, all updates kept.
# Each ecosystem opens at most 3 PRs per run: minor+patch together, majors together,
# security fixes together. Patches merge themselves once CI passes (dependabot-automerge.yml).
version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Toronto"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        update-types: ["major"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directories: ["/"]
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/Toronto"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        update-types: ["major"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
