name: Test

on:
  pull_request:
    branches: [ main, pending ]

jobs:
  test:
    # GitHub-hosted on purpose. This repo is public, so a pull request from anyone can start
    # this job; it must never run on the hz-dr runner (it has the Docker socket). Standard
    # runners are free for public repos. (2026-11-27 security audit, H9)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test

    - name: Typecheck
      run: npm run typecheck
    
    - name: Upload coverage reports
      if: matrix.node-version == '22.x'
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/coverage-final.json
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}